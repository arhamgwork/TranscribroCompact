# Builds an installable, optimized (release) APK of Transcribro Compact on every push,
# and publishes it as a GitHub Release so it can be downloaded easily on a tablet.

name: Build Transcribro Compact APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out code (including the whisper.cpp submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Create signing key on first run
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::No KEYSTORE_PASSWORD secret is set, so this build is signed with a temporary key. Each build will need the previous one uninstalled first."
            exit 0
          fi
          if [ ! -f keystore/compact-release.p12 ]; then
            mkdir -p keystore
            keytool -genkeypair -noprompt \
              -storetype PKCS12 -keystore keystore/compact-release.p12 \
              -alias compact -keyalg RSA -keysize 4096 -validity 36500 \
              -storepass "$KEYSTORE_PASSWORD" \
              -dname "CN=Transcribro Compact"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f keystore/compact-release.p12
            git commit -m "Add password-protected signing key for Transcribro Compact builds"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi

      - name: Build release APK
        env:
          COMPACT_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$COMPACT_KEYSTORE_PASSWORD" ] && [ -f keystore/compact-release.p12 ]; then
            export COMPACT_KEYSTORE_FILE="$GITHUB_WORKSPACE/keystore/compact-release.p12"
          fi
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleRelease -PcompactBuildNumber=${{ github.run_number }}

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/TranscribroCompact-build-${{ github.run_number }}.apk"
          ls -l out

      - name: Upload APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TranscribroCompact-build-${{ github.run_number }}
          path: out/*.apk

      - name: Publish GitHub Release (easy download on a tablet)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Transcribro Compact build ${{ github.run_number }}
          body: |
            Automatic build from commit ${{ github.sha }}.
            Download the .apk file below and open it on your device to install.
          files: out/*.apk
          make_latest: true
